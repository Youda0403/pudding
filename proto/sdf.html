<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>탱글 푸딩 3D 개념 확인</title>
<style>
  html,body{margin:0;height:100%;background:#efe4d6;display:flex;align-items:center;justify-content:center;}
  canvas{width:560px;height:560px;max-width:100vw;max-height:100vh;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c" width="560" height="560"></canvas>
<script id="vs" type="x-shader">#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>
<script id="fs" type="x-shader">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uTime;
uniform float uMode;      // 1 정면 실루엣, 2 측면 실루엣 (형태 검증용)
uniform vec4  uEarA;      // x: 좌우 위치, y: 붙는 높이, z: 밑동 굵기, w: 끝 굵기
uniform vec3  uEarB;      // x: 길이, y: 기울기(음수일수록 바깥/아래로), z: 블렌딩 세기
uniform vec3  uColor;     // 푸딩 색
uniform float uFace;      // 0 기본형(눈), 1 앙증형(+입), 2 볼터치형, 3 꾸미기형
uniform float uEarZ;      // 귀의 앞뒤 위치
uniform float uEarFlat;   // 1보다 작으면 납작한 귀판 (늘어진 귀)

const float PI = 3.14159265;

/* ---------- SDF 기본 도형 ---------- */
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}
// iq: 아래 반지름 r1, 위 반지름 r2, 높이 h 인 둥근 원뿔
float sdRoundCone(vec3 p, float r1, float r2, float h){
  vec2 q = vec2(length(p.xz), p.y);
  float b = (r1-r2)/h;
  float a = sqrt(max(0.0, 1.0-b*b));
  float k = dot(q, vec2(-b, a));
  if(k < 0.0) return length(q) - r1;
  if(k > a*h) return length(q - vec2(0.0, h)) - r2;
  return dot(q, vec2(a, b)) - r1;
}
float sdRoundBox(vec3 p, vec3 b, float r){
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}
float sdSeg2(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba)/dot(ba, ba), 0.0, 1.0);
  return length(pa - ba*h);
}
float smax(float a, float b, float k){
  float h = clamp(0.5 - 0.5*(b - a)/k, 0.0, 1.0);
  return mix(b, a, h) + k*h*(1.0 - h);
}
float sdEllipsoid(vec3 p, vec3 r){
  float k0 = length(p/r);
  float k1 = length(p/(r*r));
  return k0*(k0 - 1.0)/k1;
}
float sdDisc(vec3 p, float r, float h){
  vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
}
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

/* ---------- 푸딩 ----------
   레퍼런스 도면 기준. 높이 H = 1.0 을 단위로 삼는다.
     H : W : D = 1 : 1.2 : 1.4   (가로로 넓고 앞뒤로 더 깊다)
     z+ 가 앞(얼굴 쪽)

   도면의 Shape Construction 순서를 그대로 따른다.
     1) 부드러운 반구 형태의 기본 몸체
     2) 두 개의 부드러운 봉우리(귀)
     3) 크게 뭉쳐서 매끄럽게 연결
     4) 바닥을 두 갈래로 살짝 들어간 곡면으로

   푸딩이므로 어디에도 날카로운 모서리가 없다. 스무딩을 충분히 준다. */
float sdPudding(vec3 p){
  // 탱글 흔들림: 위로 갈수록 크게 기운다
  float w = 0.030*sin(uTime*2.2);
  vec3 q = p;
  q.x -= w * q.y * q.y * 2.0;
  q.z -= w * 0.35 * q.y * q.y;

  // 1) 기본 몸체 — 부드러운 반구.
  //    등이 꼬리 쪽으로 완만하게 내려가도록 z에 따라 y를 기울인다(전단).
  vec3 qs = q;
  qs.y -= 0.34 * qs.z;
  float d = sdEllipsoid(qs - vec3(0.0, -0.22, -0.05), vec3(0.66, 0.95, 0.80));

  vec3 e = q; e.x = abs(e.x);

  // 2)+3) 귀 — 부드러운 봉우리 두 개를 크게 블렌딩해서 몸체와 한 덩어리로
  vec3 ep = e - vec3(uEarA.x, uEarA.y, uEarZ);
  ep.xy = rot(uEarB.y) * ep.xy;
  ep.z /= uEarFlat;                       // 늘어진 귀는 앞뒤로 납작하게
  float ear = sdRoundCone(ep, uEarA.z, uEarA.w, uEarB.x) * uEarFlat;
  d = smin(d, ear, uEarB.z);

  // 4) 바닥: 완전히 평평하지 않고 살짝 오목하게 판다
  float dish = sdEllipsoid(q - vec3(0.0, -0.30, 0.02), vec3(0.55, 0.335, 0.64));
  d = smax(d, -dish, 0.12);

  // 바닥 가운데를 앞뒤로 얕게 갈라 두 갈래로 만든다
  float groove = sdEllipsoid(q - vec3(0.0, -0.11, 0.33), vec3(0.125, 0.195, 0.50));
  d = smax(d, -groove, 0.10);

  // 접시에 닿는 면
  d = max(d, -q.y + 0.004);
  return d;
}

/* ---------- 장면 ----------
   x: 거리, y: 재질 (0 푸딩, 1 접시, 2 카라멜) */
vec2 map(vec3 p){
  vec2 res = vec2(sdPudding(p), 0.0);
  if(uMode > 0.5) return res;      // 형태 검증 모드: 푸딩만

  // 부어놓은 듯 가장자리가 고르지 않은 웅덩이
  float ang = atan(p.z, p.x);
  float wob = 0.030*sin(ang*3.0 + 0.7) + 0.018*sin(ang*5.0 - 1.9);
  float pool = sdDisc(p - vec3(0.0, 0.007, 0.0), 0.92 + wob, 0.008);
  // 액체가 푸딩 밑동을 타고 살짝 오른 부분
  float meniscus = max(sdPudding(p) - 0.030, p.y - 0.048);
  float caramel = smin(pool, meniscus, 0.045);
  if(caramel < res.x) res = vec2(caramel, 2.0);

  float plate = min(
    sdDisc(p - vec3(0.0, -0.010, 0.0), 1.34, 0.014),
    sdDisc(p - vec3(0.0, -0.036, 0.0), 1.20, 0.018));
  if(plate < res.x) res = vec2(plate, 1.0);

  return res;
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(1.0, -1.0) * 0.0012;
  return normalize(
    e.xyy*map(p + e.xyy).x + e.yyx*map(p + e.yyx).x +
    e.yxy*map(p + e.yxy).x + e.xxx*map(p + e.xxx).x);
}

vec2 rayMarch(vec3 ro, vec3 rd){
  float t = 0.0; float m = -1.0;
  for(int i = 0; i < 160; i++){
    vec3 p = ro + rd*t;
    vec2 h = map(p);
    if(abs(h.x) < 0.0006*t + 0.0004){ m = h.y; break; }
    t += h.x * 0.78;          // 흔들림으로 좌표를 비틀었으므로 보수적으로
    if(t > 12.0) break;
  }
  if(t > 12.0) m = -1.0;
  return vec2(t, m);
}

float softShadow(vec3 ro, vec3 rd, float k){
  float res = 1.0, t = 0.03;
  for(int i = 0; i < 48; i++){
    float h = map(ro + rd*t).x;
    res = min(res, k*h/t);
    t += clamp(h, 0.012, 0.15);
    if(res < 0.02 || t > 3.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for(int i = 0; i < 5; i++){
    float h = 0.012 + 0.11*float(i)/4.0;
    occ += (h - map(p + n*h).x) * sca;
    sca *= 0.82;
  }
  return clamp(1.0 - 1.6*occ, 0.0, 1.0);
}

/* 얇은 곳일수록 빛이 통과해 보이는 느낌 (가짜 SSS) */
float translucency(vec3 p, vec3 n){
  float t = 0.0;
  for(int i = 1; i <= 5; i++){
    float h = 0.055*float(i);
    t += max(0.0, h + sdPudding(p - n*h)) / h;
  }
  return clamp(t/5.0, 0.0, 1.0);
}

/* 2D용 smooth-min (얼굴 자국을 하나로 잇는다) */
float smin2(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

/* 얼굴. 앞을 보는 면에만, 정면에서 본 x/y 위치로 찍으므로
   표면이 어디에 있든 위치가 어긋나지 않는다. (도면의 Variations)
     0 기본형   눈 라인
     1 앙증형   + 입
     2 볼터치형 + 볼터치
     3 꾸미기형 + 수염과 하트 */
float faceInk(vec3 p, vec3 n){
  float front = smoothstep(0.30, 0.66, n.z);
  if(front <= 0.0) return 0.0;
  vec2 a = vec2(abs(p.x), p.y);

  float eye = sdSeg2(a, vec2(0.100, 0.485), vec2(0.172, 0.485)) - 0.020;
  float d = eye;

  if(uFace > 0.5){           // 입: 코 점 하나 + ω 가 붙은 자국
    float nose = length(vec2(p.x, p.y) - vec2(0.0, 0.418)) - 0.016;
    float lip  = length(a - vec2(0.016, 0.400)) - 0.015;
    d = min(d, smin(nose, lip, 0.014));
  }
  if(uFace > 2.5){           // 수염
    float wa = sdSeg2(a, vec2(0.235, 0.505), vec2(0.320, 0.515)) - 0.010;
    float wb = sdSeg2(a, vec2(0.235, 0.470), vec2(0.322, 0.462)) - 0.010;
    d = min(d, min(wa, wb));
    // 오른쪽 볼의 하트
    vec2 h = vec2(p.x - 0.255, p.y - 0.555);
    float hd = abs(length(h) - 0.045) - 0.011;
    if(h.y < -0.01) hd = length(h) - 0.030;
    d = min(d, hd);
  }
  return smoothstep(0.005, -0.004, d) * front;
}

/* 볼터치 (색만 얹는다) */
float blushMask(vec3 p, vec3 n){
  if(uFace < 1.5 || uFace > 2.5) return 0.0;
  float front = smoothstep(0.25, 0.62, n.z);
  vec2 a = vec2(abs(p.x), p.y);
  return smoothstep(0.075, 0.020, length((a - vec2(0.255, 0.425)) * vec2(1.0, 1.5))) * front;
}

/* 위는 밝은 하늘, 아래는 따뜻한 바닥 반사 */
vec3 skyColor(vec3 d){
  float t = clamp(d.y*0.5 + 0.5, 0.0, 1.0);
  return mix(vec3(0.52, 0.44, 0.36), vec3(1.00, 0.98, 0.94), t);
}

vec3 background(vec2 uv){
  vec3 top = vec3(0.960, 0.918, 0.856);
  vec3 bot = vec3(0.836, 0.760, 0.676);
  vec3 col = mix(bot, top, smoothstep(-0.6, 0.8, uv.y));
  col *= 1.0 - 0.15*dot(uv, uv);        // 비네트
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;

  // 카메라
  vec3 ro = vec3(1.05, 0.82, 2.45);
  vec3 ta = vec3(0.0, 0.40, 0.0);
  float zoom = 2.1;
  if(uMode > 1.5){                  // 형태 검증: 측면
    ro = vec3(5.0, 0.50, 0.0);
    ta = vec3(0.0, 0.50, 0.0);
    zoom = 5.4;
  } else if(uMode > 0.5){           // 형태 검증: 정면·거의 직교
    ro = vec3(0.0, 0.50, 5.0);
    ta = vec3(0.0, 0.50, 0.0);
    zoom = 5.4;
  }
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + zoom*ww);

  vec3 col = background(uv);
  bool isBg = true;

  vec2 hit = rayMarch(ro, rd);
  if(uMode > 0.5){
    fragColor = vec4(vec3(hit.y >= 0.0 ? 0.1 : 1.0), 1.0);
    return;
  }
  if(hit.y >= 0.0){
    isBg = false;
    vec3 p = ro + rd*hit.x;
    vec3 n = calcNormal(p);

    vec3 lig  = normalize(vec3(-0.40, 1.18, 0.42));   // 키 라이트 (왼쪽 위 앞)
    vec3 lig2 = normalize(vec3(0.75, 0.30, -0.50));   // 뒤쪽 채움
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float sha = softShadow(p + n*0.012, lig, 12.0);
    float ao  = calcAO(p, n);
    float bac = clamp(dot(n, lig2), 0.0, 1.0);
    float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 5.0);
    vec3  ref = reflect(rd, n);
    vec3  env = skyColor(ref);                         // 가짜 환경 반사

    vec3 hal = normalize(lig - rd);
    float spe  = pow(clamp(dot(n, hal), 0.0, 1.0), 520.0);
    float spe2 = pow(clamp(dot(n, hal), 0.0, 1.0), 28.0);

    vec3 base; float gloss; float envAmt;

    if(hit.y < 0.5){
      // 푸딩: 부드러운 커스터드. 얇은 곳은 빛이 통과한다.
      // 지정한 색은 sRGB다. 선형으로 바꿔서 조명 계산에 넣어야
      // 마지막 감마 보정 뒤에 원래 의도한 색이 나온다.
      base = pow(uColor, vec3(2.2));
      float sss = translucency(p, n);
      // 얇은 곳이 비쳐 보이는 정도는 본체 색에 비례해야
      // 어두운 색(곰·쥐)이 하얗게 날아가지 않는다
      base += base * vec3(0.55, 0.34, 0.10) * sss * 0.95;
      base = mix(base, vec3(0.97, 0.62, 0.60), blushMask(p, n) * 0.55);
      float face = faceInk(p, n);
      base = mix(base, vec3(0.20, 0.14, 0.10), face);
      gloss = 1.0 - face*0.55;
      envAmt = 0.16;
    } else if(hit.y < 1.5){
      base = vec3(0.955, 0.945, 0.935);               // 흰 도자기
      gloss = 0.55; envAmt = 0.10;
    } else {
      // 카라멜. 푸딩에 가까울수록 깊어서 진하다.
      float deep = smoothstep(0.92, 0.50, length(p.xz));
      base = mix(vec3(0.70, 0.31, 0.02), vec3(0.30, 0.10, 0.006), deep);
      gloss = 2.2; envAmt = 0.55;
    }

    vec3 lin = vec3(0.0);
    lin += base * dif * sha * vec3(1.06, 1.00, 0.92) * 1.15;
    lin += base * bac * 0.20 * vec3(1.00, 0.95, 0.92);
    lin += base * ao  * skyColor(n) * 0.34;            // 하늘/바닥 앰비언트
    lin += base * fre * 0.14;

    col = lin;
    col = mix(col, env, fre * envAmt);                 // 젖은 표면 반사
    col += spe  * sha * 0.72 * gloss;
    col += spe2 * sha * 0.07 * gloss;
  }

  // 톤매핑 + 감마 (배경은 이미 완성된 색이라 건드리지 않는다)
  if(!isBg){
    col = col / (col + 1.0) * 1.62;   // 중간톤을 덜 들어올려 진한 색이 남게
    col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
  }
  fragColor = vec4(col, 1.0);
}
</script>
<script>
(function(){
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
  if(!gl){ document.body.textContent = 'WebGL2를 쓸 수 없습니다.'; return; }

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uTime = gl.getUniformLocation(prog, 'uTime');
  var uMode = gl.getUniformLocation(prog, 'uMode');
  var uEarA = gl.getUniformLocation(prog, 'uEarA');
  var uEarB = gl.getUniformLocation(prog, 'uEarB');
  var uColor = gl.getUniformLocation(prog, 'uColor');
  var uFace = gl.getUniformLocation(prog, 'uFace');
  var uEarZ = gl.getUniformLocation(prog, 'uEarZ');
  var uEarFlat = gl.getUniformLocation(prog, 'uEarFlat');

  /* 동물 = 귀 치수표 (레퍼런스 Ear Dimensions, 전체 높이 H = 1 기준)
       eh  귀 높이   — 몸체 표면에서 귀 끝까지
       ew  귀 간격   — 두 귀 축 사이 거리
       es  귀 돌출   — 귀 밑동 굵기(지름)
       ea  귀 기울기 — 세로에서 바깥으로 기운 각도(도)
     tip   단면도의 끝 모양을 밑동 대비 비율로 옮긴 값
     drop  늘어진 귀(강아지·롭이어). 표의 eh는 머리 위로 솟은 높이라
           늘어진 길이는 len으로 따로 준다. */
  var EAR_SPEC = {
    cat:      { eh: 0.28, ew: 0.60, es: 0.25, ea: 20, tip: 0.45 },  // 삼각형 곡선
    dog:      { eh: 0.18, ew: 0.85, es: 0.26, ea: 35, tip: 0.72, drop: 1, len: 0.40, exDrop: 0.33, ezDrop: 0.52, eyDrop: 0.60 },  // 둥근 처짐
    rabbit:   { eh: 0.45, ew: 0.35, es: 0.30, ea: 10, tip: 0.55 },  // 타원형
    lop:      { eh: 0.30, ew: 0.70, es: 0.30, ea: 22, tip: 0.68, drop: 1, len: 0.52, exDrop: 0.30, ezDrop: 0.50, eyDrop: 0.62 },  // 긴 타원형
    bear:     { eh: 0.22, ew: 0.70, es: 0.20, ea: 0,  tip: 0.90 },  // 반원형
    mouse:    { eh: 0.30, ew: 0.65, es: 0.22, ea: 10, tip: 0.95 },  // 원형
    fox:      { eh: 0.40, ew: 0.55, es: 0.28, ea: 25, tip: 0.30 },  // 날카로운 곡선
    squirrel: { eh: 0.32, ew: 0.50, es: 0.25, ea: 15, tip: 0.50 }   // S자 곡선
  };

  /* 레퍼런스 Color Variations */
  var ANIMAL_COLOR = {
    cat:      [0.965, 0.905, 0.780],
    dog:      [0.925, 0.835, 0.690],
    rabbit:   [0.975, 0.930, 0.905],
    lop:      [0.960, 0.885, 0.870],
    bear:     [0.800, 0.620, 0.440],
    mouse:    [0.780, 0.775, 0.775],
    fox:      [0.930, 0.720, 0.360],
    squirrel: [0.775, 0.565, 0.385]
  };

  /* 몸체 표면의 높이. 셰이더의 몸통 식과 같은 값이어야
     귀가 "몸체에서 eh만큼 솟은" 상태가 된다. */
  function bodyTopAt(x, z){
    var zz = z + 0.05;
    var k = 1.0 - (x/0.66)*(x/0.66) - (zz/0.80)*(zz/0.80);
    if(k <= 0.0) return 0.0;
    return -0.22 + 0.95*Math.sqrt(k) + 0.34*z;
  }

  /* 치수표 → 셰이더가 쓰는 원뿔 파라미터 */
  function earParams(name){
    var S = EAR_SPEC[name] || EAR_SPEC.cat;
    // 늘어진 귀는 몸통(반폭 0.60) 가장자리에 걸치도록 내보내야
    // 안쪽은 묻히고 바깥쪽만 귀판으로 드러난다
    var ex = S.drop ? S.exDrop : S.ew / 2;
    var er1 = S.es / 2;
    var er2 = er1 * S.tip;
    // 늘어진 귀는 몸통 앞면 밖으로 나와야 귀판으로 보인다
    var ez = S.drop ? S.ezDrop : 0.10;
    var top = bodyTopAt(ex, ez);
    var rad = S.ea * Math.PI / 180;
    var ey, eh, tilt;
    if(S.drop){
      // 머리 옆 위쪽에 붙어 바깥·아래로 늘어진다
      ey = S.eyDrop;
      eh = Math.max(0.05, S.len - er2);
      tilt = rad - Math.PI;          // 아래를 향하고 ea 만큼 바깥으로
    } else {
      // 몸체 표면에서 eh 만큼 솟는다
      ey = top - er1 * 0.55;
      eh = Math.max(0.05, top + S.eh - ey - er2);
      tilt = -rad;                   // 세로에서 바깥으로 ea
    }
    // 블렌딩: 굵은 귀일수록 크게 뭉갠다 (레퍼런스 Tips 1·2)
    var k = S.drop ? 0.050 : Math.min(0.20, 0.090 + er1 * 0.60);
    return { a: [ex, ey, er1, er2], b: [eh, tilt, k], z: ez, flat: S.drop ? 0.50 : 1.0 };
  }

  window.PUDDING3D = {
    paused: false, mode: 0, face: 0,
    animal: 'cat', color: [0.995, 0.912, 0.700],
    useAnimalColor: true, animalColors: ANIMAL_COLOR,
    animals: EAR_SPEC, earParams: earParams,
    wobblePeriod: 2.0*Math.PI/2.2,
    draw: function(t){
    var A = earParams(window.PUDDING3D.animal);
    var C = window.PUDDING3D.useAnimalColor
      ? (ANIMAL_COLOR[window.PUDDING3D.animal] || window.PUDDING3D.color)
      : window.PUDDING3D.color;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t);
    gl.uniform1f(uMode, window.PUDDING3D.mode);
    gl.uniform4f(uEarA, A.a[0], A.a[1], A.a[2], A.a[3]);
    gl.uniform3f(uEarB, A.b[0], A.b[1], A.b[2]);
    gl.uniform1f(uEarZ, A.z);
    gl.uniform1f(uEarFlat, A.flat);
    gl.uniform3f(uColor, C[0], C[1], C[2]);
    gl.uniform1f(uFace, window.PUDDING3D.face);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
  }};

  var start = performance.now();
  function frame(){
    if(!window.PUDDING3D.paused){
      window.PUDDING3D.draw((performance.now() - start)/1000);
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
