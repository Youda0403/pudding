<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>고양이 푸딩 SDF</title>
<style>
  html,body{margin:0;height:100%;background:#efe4d6;display:flex;align-items:center;justify-content:center;}
  canvas{width:640px;height:640px;max-width:100vw;max-height:100vh;display:block;touch-action:none;}
  .hint{position:fixed;left:12px;bottom:10px;margin:0;font:12px/1.5 system-ui,-apple-system,sans-serif;color:#7b6a58;}
</style>
</head>
<body>
<canvas id="c" width="640" height="640"></canvas>
<p class="hint" id="hint">드래그: 시점 · 1 완성 · 2 정면 실루엣 · 3 측면 실루엣 · Space 흔들림 · A 동물 8종 · E 눈 5종 · M 입 4종</p>

<script src="../js/color.js"></script>
<script src="../js/sdf/shader.js"></script>
<script src="../js/sdf/scene.js"></script>

<script>
(function(){
  var canvas = document.getElementById('c');
  var CAT = window.CAT3D = PUDDING.createScene(canvas);

  // 눈·입 종류. E / M 키로 돌려 가며 본다.
  var EYES = ['동글', '올라간', '내려간', '반', '웃는'];
  var MOUTHS = ['ω', '^', '일자', '웃는'];
  var ANIMALS = ['고양이', '강아지', '토끼', '롭이어', '곰', '쥐', '여우', '햄스터'];

  var hint = document.getElementById('hint');
  var hintBase = hint.textContent;
  function showFace(){
    hint.textContent = hintBase + '  —  ' + ANIMALS[CAT.animal] +
      ' / ' + EYES[CAT.eye] + ' 눈 / ' + MOUTHS[CAT.mouth] + ' 입';
  }

  var drag = null;
  canvas.addEventListener('pointerdown', function(e){ drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', function(){ drag = null; });
  canvas.addEventListener('pointermove', function(e){
    if(!drag) return;
    CAT.az -= (e.clientX - drag.x)*0.006;
    CAT.el = Math.max(-0.35, Math.min(1.15, CAT.el + (e.clientY - drag.y)*0.005));
    drag = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('keydown', function(e){
    if(e.key === '1') CAT.mode = 0;
    if(e.key === '2') CAT.mode = 1;
    if(e.key === '3') CAT.mode = 2;
    if(e.key === ' '){ CAT.jiggle = CAT.jiggle > 0 ? 0 : 1; e.preventDefault(); }
    if(e.key === 'e' || e.key === 'E'){
      CAT.eye = (CAT.eye + 1) % EYES.length;
      showFace();
    }
    if(e.key === 'm' || e.key === 'M'){
      CAT.mouth = (CAT.mouth + 1) % MOUTHS.length;
      showFace();
    }
    if(e.key === 'a' || e.key === 'A'){
      CAT.animal = (CAT.animal + 1) % ANIMALS.length;
      showFace();
    }
  });

  var start = performance.now();
  (function frame(){
    CAT.draw((performance.now() - start)/1000);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
