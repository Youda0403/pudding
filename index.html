<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#fdf6ec" />
<title>탱글 푸딩 만들기</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 휴대폰에서 쓰는 화면이라 앱처럼 짠다.
     미리보기는 늘 제자리에 고정, 가운데 선택지만 스크롤,
     많이 누르는 버튼(랜덤·저장)은 엄지가 닿는 아래에. -->

<header class="hd">
  <h1>탱글 푸딩</h1>
</header>

<section class="stage">
  <div class="frame">
    <canvas id="view" width="640" height="640" aria-label="푸딩 미리보기"></canvas>
    <div class="busy" id="busy" hidden>
      <div class="busy-box">
        <p id="busyText">GIF 만드는 중…</p>
        <div class="bar"><i id="busyBar"></i></div>
      </div>
    </div>
  </div>
  <p class="tip">톡 누르면 흔들리고, 끌면 돌아가요</p>
</section>

<main class="panel" id="panel">
  <h2>동물</h2>
  <div class="chips" id="animals"></div>

  <h2>눈</h2>
  <div class="chips" id="eyes"></div>

  <h2>입</h2>
  <div class="chips" id="mouths"></div>

  <h2>얼굴 꾸미기</h2>
  <div class="chips" id="faceDecor"></div>
  <div class="positions" id="markPositions"></div>

  <h2>꾸미기</h2>
  <div class="chips" id="toppings"></div>

  <h2>접시</h2>
  <div class="chips" id="plates"></div>

  <h2>색</h2>
  <div class="colors" id="colors"></div>

  <h2>저장할 움직임</h2>
  <div class="chips" id="gifModes">
    <button type="button" class="chip" data-motion="rotate" aria-pressed="true">천천히 한 바퀴</button>
    <button type="button" class="chip" data-motion="bounce" aria-pressed="false">제자리 뾰잉</button>
  </div>
  <p class="foot" id="notice" role="status" aria-live="polite"></p>
</main>

<footer class="acts">
  <button type="button" class="btn ghost" id="random">랜덤</button>
  <button type="button" class="btn" id="savePng">PNG 저장</button>
  <button type="button" class="btn go" id="save">GIF 저장</button>
</footer>

<script src="js/color.js"></script>
<script src="js/gif.js"></script>
<script src="js/sdf/shader.js"></script>
<script src="js/sdf/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
