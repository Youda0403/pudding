<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#fdf6ec" />
<title data-i18n="title">탱글 푸딩 만들기</title>
<script>
/* 새로고침할 때마다 최신 스타일을 요청한다. HTML과 그 외 UI는 변경하지 않는다. */
var assetVersion = Date.now();
var stylesheet = document.createElement('link');
stylesheet.rel = 'stylesheet';
stylesheet.href = 'styles.css?v=' + assetVersion;
document.head.appendChild(stylesheet);
</script>
</head>
<body>

<!-- 휴대폰에서 쓰는 화면이라 앱처럼 짠다.
     미리보기는 늘 제자리에 고정, 가운데 선택지만 스크롤,
     많이 누르는 버튼(랜덤·저장)은 엄지가 닿는 아래에. -->

<header class="hd">
  <h1 data-i18n="heading">탱글 푸딩</h1>
  <button type="button" id="languageToggle" class="lang-btn" data-i18n="language.button" data-i18n-aria="language.next" aria-label="영어로 전환">EN</button>
</header>

<section class="stage">
  <div class="frame">
    <canvas id="view" width="640" height="640" data-i18n-aria="canvas.label" aria-label="푸딩 미리보기"></canvas>
    <div class="busy" id="busy" hidden>
      <div class="busy-box">
        <p id="busyText" data-i18n="progress.gifPreparing">GIF 만드는 중…</p>
        <div class="bar"><i id="busyBar"></i></div>
      </div>
    </div>
  </div>
  <p class="tip" data-i18n="tip">톡 누르면 흔들리고, 끌면 돌아가요</p>
</section>

<main class="panel" id="panel">
  <h2 data-i18n="section.animals">동물</h2>
  <div class="chips" id="animals"></div>

  <h2 data-i18n="section.eyes">눈</h2>
  <div class="chips" id="eyes"></div>

  <h2 data-i18n="section.mouths">입</h2>
  <div class="chips" id="mouths"></div>

  <h2 data-i18n="section.faceDecor">얼굴 꾸미기</h2>
  <div class="chips" id="faceDecor"></div>
  <div class="positions" id="markPositions"></div>

  <h2 data-i18n="section.toppings">꾸미기</h2>
  <div class="chips" id="toppings"></div>

  <h2 data-i18n="section.plates">접시</h2>
  <div class="chips" id="plates"></div>

  <h2 data-i18n="section.bgPatterns">배경 패턴</h2>
  <div class="chips" id="bgPatterns"></div>

  <h2 data-i18n="section.colors">색</h2>
  <div class="colors" id="colors"></div>

  <h2 data-i18n="section.gifModes">저장할 움직임</h2>
  <div class="chips" id="gifModes">
    <button type="button" class="chip" data-i18n="motion.rotate" data-motion="rotate" aria-pressed="true">천천히 한 바퀴</button>
    <button type="button" class="chip" data-i18n="motion.bounce" data-motion="bounce" aria-pressed="false">제자리 뾰잉</button>
  </div>
  <p class="foot" id="notice" role="status" aria-live="polite"></p>
</main>

<footer class="acts">
  <button type="button" class="btn" data-i18n="action.savePng" id="savePng">PNG 저장</button>
  <button type="button" class="btn go" data-i18n="action.saveGif" id="save">GIF 저장</button>
</footer>

<script>
/* 같은 URL의 오래된 JS가 남지 않도록 파일별 버전 URL로 불러온다.
   async=false는 동적 스크립트의 실행 순서를 기존 HTML과 동일하게 유지한다. */
['js/color.js', 'js/gif.js', 'js/sdf/shader.js',
 'js/sdf/scene.js', 'js/i18n.js', 'js/app.js'].forEach(function (path) {
  var script = document.createElement('script');
  script.async = false;
  script.src = path + '?v=' + assetVersion;
  document.body.appendChild(script);
});
</script>
</body>
</html>
